spring.application.name=loglens

# Reject uploads bigger than 5 MB (the whole request is capped slightly higher for form overhead)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Never show Java stack traces to the user in an error page
server.error.include-stacktrace=never
   spring.thymeleaf.cache=false